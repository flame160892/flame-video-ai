name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Generate app icon & splash
        continue-on-error: true
        run: npx @capacitor/assets generate --android --iconBackgroundColor '#07080f' --iconBackgroundColorDark '#07080f' --splashBackgroundColor '#07080f' --splashBackgroundColorDark '#07080f'

      - name: Sync web files
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk FLAME-Video-AI.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FLAME-Video-AI-apk
          path: FLAME-Video-AI.apk

      - name: Publish release (link download langsung)
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: FLAME Video AI build ${{ github.run_number }}
          body: APK otomatis dari commit ${{ github.sha }}. Download FLAME-Video-AI.apk di bawah, lalu install di HP Android.
          files: FLAME-Video-AI.apk
